<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Grammar Hub | Lý Tú Thanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f0f4f8; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .locked { filter: blur(2px); pointer-events: none; opacity: 0.6; }
        input[type="text"] { border: 1px solid #cbd5e1; border-radius: 5px; padding: 5px; width: 100px; text-align: center; }
        .correct { background-color: #d1fae5; color: #065f46; }
        .incorrect { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="p-4">

    <!-- HEADER & QUẢN TRỊ -->
    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-indigo-700 uppercase">Grammar Hub 4.0</h1>
        <button onclick="openAdmin()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg">🛡️ QUẢN TRỊ</button>
    </div>

    <!-- KHU VỰC ĐĂNG NHẬP (NỔI LÊN KHI CẦN) -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-sm text-center space-y-4 shadow-2xl">
            <h2 class="font-bold text-xl uppercase">Đăng nhập để làm bài</h2>
            <input type="text" id="st-name" class="w-full p-3 border rounded-xl mb-2" placeholder="Họ và Tên">
            <select id="st-class" class="w-full p-3 border rounded-xl font-bold">
                <option value="">-- Chọn lớp --</option>
                <option value="C25DC1">C25DC1</option>
                <option value="LC25BT2">LC25BT2</option>
            </select>
            <button onclick="confirmLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">XÁC NHẬN</button>
            <button onclick="closeLogin()" class="text-slate-400 text-sm">Hủy bỏ</button>
        </div>
    </div>

    <!-- MAIN CONTENT (HIỆN ĐẦY ĐỦ NGAY TỪ ĐẦU) -->
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Dashboard Thông tin -->
        <div class="bg-white p-6 rounded-3xl shadow-md border-l-8 border-indigo-600 flex justify-between items-center">
            <div>
                <p class="text-xs font-bold text-slate-400 uppercase">Giáo viên phụ trách</p>
                <h2 class="text-xl font-black uppercase">Lý Tú Thanh</h2>
                <div id="user-status" class="mt-2 text-indigo-600 font-bold text-sm italic">Học sinh chưa đăng nhập</div>
            </div>
            <div id="qrcode" class="p-2 bg-white border rounded-lg"></div>
        </div>

        <!-- Nội dung bài tập (Luôn hiện để xem) -->
        <section class="bg-white p-6 rounded-3xl shadow-lg border">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-indigo-600 uppercase">Bài tập: Story Time (Hệ điểm 10)</h3>
                <div id="lock-btn-area">
                    <button onclick="showLogin()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold animate-pulse">ĐĂNG NHẬP ĐỂ LÀM</button>
                </div>
            </div>

            <!-- Bài tập sẽ bị khóa/mở dựa trên trạng thái đăng nhập -->
            <div id="exercise-content" class="locked leading-relaxed italic text-slate-700 bg-slate-50 p-6 rounded-2xl text-justify">
                <!-- Nội dung bài tập 3 của cô sẽ ở đây -->
                Yesterday was the (bad) [1] day of my life...
            </div>
        </section>
    </div>

    <!-- TRANG ADMIN (ẨN) -->
    <div id="admin-panel" class="fixed inset-0 bg-white z-[60] hidden overflow-hidden flex flex-col">
        <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
            <h2 class="font-bold uppercase tracking-widest">Bảng điểm tổng quát - Admin</h2>
            <button onclick="closeAdmin()" class="bg-red-500 px-4 py-1 rounded">Đóng</button>
        </div>
        <!-- Link Google Sheets của cô sẽ dán vào đây -->
        <iframe src="ĐƯỜNG_DẪN_GOOGLE_SHEET_CỦA_CÔ" class="flex-grow w-full border-none"></iframe>
    </div>

    <script>
        // Logic điều khiển
        function showLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLogin() { document.getElementById('login-modal').classList.add('hidden'); }

        function confirmLogin() {
            const name = document.getElementById('st-name').value;
            const cls = document.getElementById('st-class').value;
            if(!name || !cls) return alert("Vui lòng điền đủ thông tin!");
            
            // Mở khóa nội dung
            document.getElementById('exercise-content').classList.remove('locked');
            document.getElementById('user-status').innerText = `Học sinh: ${name} - Lớp: ${cls}`;
            document.getElementById('lock-btn-area').innerHTML = `<button onclick="submitScore()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold">CHẤM ĐIỂM & GỬI KẾT QUẢ</button>`;
            closeLogin();
        }

        function openAdmin() {
            const pass = prompt("Nhập mã bảo mật dành cho giáo viên:");
            if(pass === "1234") { // Cô đổi mật khẩu ở đây
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                alert("Sai mã bảo mật!");
            }
        }
        function closeAdmin() { document.getElementById('admin-panel').classList.add('hidden'); }

        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 64, height: 64 });
        };
    </script>
</body>
</html>
