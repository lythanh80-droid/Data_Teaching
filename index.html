<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Hub | C25DC1 & LC25BT2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Thư viện tạo mã QR tự động -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fdfbf7; }
        .sidebar-item.active { background-color: #f3f4f6; color: #4f46e5; border-right: 4px solid #4f46e5; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type="text"] { border-bottom: 2px solid #e2e8f0; outline: none; background: transparent; padding: 2px; width: 120px; text-align: center; font-weight: bold; color: #4f46e5; }
        .correct { color: #059669; border-bottom-color: #059669 !important; }
        .incorrect { color: #dc2626; border-bottom-color: #dc2626 !important; }
    </style>
</head>
<body class="text-slate-800">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col sticky top-0 h-screen">
            <div class="p-6 text-center border-b">
                <h1 class="text-xl font-bold text-indigo-600 mb-4">GRAMMAR HUB</h1>
                <!-- KHUNG CHỨA MÃ QR -->
                <div id="qrcode" class="flex justify-center p-2 bg-white border rounded-xl shadow-inner mx-auto w-32 h-32"></div>
                <p class="text-[10px] font-bold text-slate-400 mt-2 uppercase tracking-widest">Quét để làm bài</p>
            </div>
            <nav class="flex-grow">
                <button onclick="showTab('dashboard')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3 active" id="btn-dashboard">📊 Tổng quan</button>
                <button onclick="showTab('lessons')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3" id="btn-lessons">📖 Bài học lý thuyết</button>
                <button onclick="showTab('practice')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3" id="btn-practice">✍️ Luyện tập</button>
                <button onclick="showTab('game')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3" id="btn-game">🎮 Thử thách 30 câu</button>
            </nav>
            <div class="p-6 border-t border-slate-100 text-[10px] font-bold text-slate-400 uppercase">Lớp: C25DC1 & LC25BT2</div>
        </aside>

        <!-- Main Content (Nội dung bài học của cô Thanh giữ nguyên) -->
        <main class="flex-grow p-4 md:p-10 overflow-y-auto">
            <!-- Copy toàn bộ nội dung Section Dashboard, Lessons, Practice và Game của cô dán vào đây -->
            <section id="tab-dashboard" class="tab-view active space-y-6 text-center">
                <div class="bg-indigo-600 text-white p-10 rounded-[2.5rem] shadow-xl">
                    <h2 class="text-3xl font-bold uppercase mb-2">Lý Tú Thanh - Dashboard</h2>
                    <p class="opacity-80">Chào mừng các em lớp C25DC1 & LC25BT2</p>
                </div>
                <p class="text-slate-500">Hãy nhấn vào các mục bên trái hoặc quét mã QR để bắt đầu.</p>
            </section>
        </main>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        window.onload = function() {
            // TỰ ĐỘNG TẠO MÃ QR TỪ LINK HIỆN TẠI
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 120,
                height: 120
            });
        };
    </script>
</body>
</html>
