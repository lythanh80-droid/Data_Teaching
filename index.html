<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Hub | C25DC1 & LC25BT2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f0f4f8; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        input[type="text"] { border: 2px solid #cbd5e1; border-radius: 8px; padding: 8px; width: 100%; font-weight: bold; color: #4f46e5; outline: none; }
        .correct { background-color: #d1fae5 !important; color: #065f46; border-color: #10b981 !important; }
        .incorrect { background-color: #fee2e2 !important; color: #991b1b; border-color: #ef4444 !important; }
    </style>
</head>
<body class="p-4">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center space-y-6">
            <h2 class="text-2xl font-bold text-indigo-600 uppercase">Thông tin học sinh</h2>
            <input type="text" id="student-name" class="border-2 border-indigo-100 p-4 rounded-2xl w-full text-center" placeholder="Nhập Họ và Tên của em">
            <select id="student-class" class="w-full p-4 border-2 border-slate-200 rounded-2xl font-bold text-slate-600">
                <option value="">-- Chọn lớp học --</option>
                <option value="C25DC1">C25DC1</option>
                <option value="LC25BT2">LC25BT2</option>
            </select>
            <button onclick="startApp()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">BẮT ĐẦU</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden space-y-6">
        <div class="bg-indigo-600 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
            <div>
                <h2 id="display-name" class="font-bold text-xl uppercase"></h2>
                <p id="display-class" class="text-xs opacity-80 font-bold"></p>
            </div>
            <div id="qrcode"></div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white p-2 rounded-xl border border-indigo-100"><p class="text-[10px] font-bold">BÀI 1</p><p id="score-ex1" class="text-indigo-600 font-bold">--</p></div>
            <div class="bg-white p-2 rounded-xl border border-indigo-100"><p class="text-[10px] font-bold">BÀI 2</p><p id="score-ex2" class="text-indigo-600 font-bold">--</p></div>
            <div class="bg-white p-2 rounded-xl border border-indigo-100"><p class="text-[10px] font-bold">BÀI 3</p><p id="score-ex3" class="text-indigo-600 font-bold">--</p></div>
        </div>

        <!-- NAVIGATION -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="showTab('ex1')" class="bg-white p-3 rounded-xl border-2 border-indigo-100 font-bold text-xs uppercase shadow-sm">Luyện 1</button>
            <button onclick="showTab('ex2')" class="bg-white p-3 rounded-xl border-2 border-indigo-100 font-bold text-xs uppercase shadow-sm">Luyện 2</button>
            <button onclick="showTab('ex3')" class="bg-white p-3 rounded-xl border-2 border-indigo-100 font-bold text-xs uppercase shadow-sm">Luyện 3</button>
        </div>

        <!-- EXERCISE SECTIONS (Các phần bài tập giữ nguyên cấu trúc trước của cô) -->
        <section id="tab-ex3" class="tab-view active space-y-4">
            <div class="bg-white p-6 rounded-3xl shadow-md border-t-8 border-emerald-500">
                <h3 class="font-bold text-emerald-600 mb-4 uppercase">Bài 3: Story Time (Quy đổi hệ 10)</h3>
                <div id="ex3-container" class="leading-loose italic text-slate-700 bg-slate-50 p-4 rounded-xl text-sm text-justify"></div>
                <button onclick="checkEx3()" class="w-full mt-6 bg-emerald-600 text-white py-4 rounded-xl font-black shadow-lg uppercase">Kết thúc & Chấm điểm</button>
            </div>
        </section>
    </div>

    <script>
        const EX3_ANS = ["worst", "later", "colder", "more crowded", "most frustrating", "farther", "more tired", "tallest", "angrier", "most reliable", "sadder", "cheapest", "worse", "more stressful", "most important", "more exhausted", "most beautiful", "better", "most difficult", "brighter"];
        const EX3_RAW = "Yesterday was the (1. bad) [1] day of my life... [Nội dung bài 3 của cô]";

        function startApp() {
            const name = document.getElementById('student-name').value.trim();
            const className = document.getElementById('student-class').value;
            if(!name || !className) return alert("Nhập tên và chọn lớp nhé!");
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-class').innerText = "Lớp: " + className;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 60, height: 60 });
            let storyHtml = EX3_RAW;
            for(let i=0; i<20; i++) {
                storyHtml = storyHtml.replace(`[${i+1}]`, `<input type="text" id="ex3-in-${i}" style="width:80px; border-bottom:1px solid #6366f1; border-radius:0; padding:0" placeholder="?">`);
            }
            document.getElementById('ex3-container').innerHTML = storyHtml;
        };

        function showTab(id) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
        }

        // HÀM TÍNH ĐIỂM QUY ĐỔI HỆ 10
        function calculateScale10(correct, total) {
            return ((correct / total) * 10).toFixed(1);
        }

        function checkEx3() {
            let correct = 0;
            EX3_ANS.forEach((ans, i) => {
                const inp = document.getElementById(`ex3-in-${i}`);
                if(inp.value.trim().toLowerCase() === ans.toLowerCase()) {
                    correct++;
                    inp.className = "correct";
                } else {
                    inp.className = "incorrect";
                }
            });

            // Tính điểm bình quân thang điểm 10
            const score10 = calculateScale10(correct, 20);
            document.getElementById('score-ex3').innerText = score10 + "/10";
            
            alert(`Kết quả bài làm:\n- Số câu đúng: ${correct}/20\n- Điểm quy đổi: ${score10} điểm`);
        }
    </script>
</body>
</html>
