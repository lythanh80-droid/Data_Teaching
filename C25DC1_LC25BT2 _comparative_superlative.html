<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Grammar Hub | C25DC1 & LC25BT2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fdfbf7; }
        .chart-container { position: relative; width: 100%; height: 300px; margin: auto; }
        .sidebar-item.active { background-color: #f3f4f6; color: #4f46e5; border-right: 4px solid #4f46e5; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input[type="text"] { border-bottom: 2px solid #e2e8f0; transition: all 0.3s ease; outline: none; background: transparent; }
        input[type="text"]:focus { border-bottom-color: #4f46e5; }
        .correct { color: #059669; border-bottom-color: #059669 !important; font-weight: bold; }
        .incorrect { color: #dc2626; border-bottom-color: #dc2626 !important; font-weight: bold; }
    </style>
</head>
<body class="text-slate-800">

    <div class="flex min-h-screen">
        <!-- Sidebar Điều hướng -->
        <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col sticky top-0 h-screen">
            <div class="p-6">
                <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                    <span class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center">G</span> Hub
                </h1>
            </div>
            <nav class="flex-grow">
                <button onclick="showTab('dashboard')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3 active" id="btn-dashboard">📊 Tổng quan</button>
                <button onclick="showTab('lessons')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3" id="btn-lessons">📖 Lý thuyết</button>
                <button onclick="showTab('practice')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3" id="btn-practice">✍️ Luyện tập</button>
                <button onclick="showTab('game')" class="sidebar-item w-full text-left px-6 py-4 flex items-center gap-3" id="btn-game">🎮 Quiz 30 Câu</button>
            </nav>
            <div class="p-6 border-t text-[10px] font-bold text-slate-400 uppercase">Lớp: C25DC1 & LC25BT2</div>
        </aside>

        <!-- Nội dung chính -->
        <main class="flex-grow p-4 md:p-10 overflow-y-auto">
            <!-- Thống kê Tiến độ -->
            <section id="tab-dashboard" class="tab-view active space-y-8">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-3xl font-bold text-slate-900">Chào cô Thanh!</h2>
                        <p class="text-slate-500">Dưới đây là tiến độ học tập của lớp.</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-xs text-slate-400 font-bold uppercase">Bài tập 1 (20 câu)</p>
                        <h3 class="text-3xl font-black" id="stat-ex1">0/20</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-xs text-slate-400 font-bold uppercase">Bài tập 2 (10 câu)</p>
                        <h3 class="text-3xl font-black" id="stat-ex2">0/10</h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <p class="text-xs text-slate-400 font-bold uppercase">Bài tập 3 (Story)</p>
                        <h3 class="text-3xl font-black" id="stat-ex3">0/20</h3>
                    </div>
                </div>
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 h-80">
                    <canvas id="pointsChart"></canvas>
                </div>
            </section>

            <!-- Bài tập 3: Story Time -->
            <section id="tab-practice" class="tab-view space-y-8">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-indigo-600 uppercase">Bài tập 3: Story Time (20 Blanks)</h3>
                        <button onclick="checkEx3()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg shadow-emerald-100">Kiểm tra kết quả</button>
                    </div>
                    <div id="story-container" class="leading-loose text-justify text-slate-700 italic text-lg p-6 bg-slate-50 rounded-2xl">
                        <!-- Nội dung câu chuyện sẽ được JS chèn vào -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const STORY_ANSWERS = ["worst", "later", "colder", "more crowded", "most frustrating", "farther", "more tired", "tallest", "angrier", "most reliable", "sadder", "cheapest", "worse", "more stressful", "most important", "more exhausted", "most beautiful", "better", "most difficult", "brighter"];
        const STORY_RAW = "Yesterday was the (1. bad) [1] day of my life. I woke up (2. late) [2] than usual. The weather was (3. cold) [3] than it had been all week. I took the bus, but it was (4. crowded) [4] than a Sunday bus. The (5. frustrating) [5] part was when the bus broke down. I had to walk, and the (6. far) [6] I walked, the (7. tired) [7] I became. My office is in the (8. tall) [8] building in the city. When I arrived, my boss was (9. angry) [9] than a bear. He said I was the (10. reliable) [10] worker he had. I felt (11. sad) [11] than ever. At lunch, I bought the (12. cheap) [12] sandwich, but it tasted (13. awful) [13] than cardboard. The afternoon was even (14. stressful) [14]. I had to finish the (15. important) [15] report of the year. By 5 PM, I was (16. exhausted) [16] than my colleagues. On my way home, I saw the (17. beautiful) [17] sunset, which made me feel a bit (18. good) [18]. I realized that even the (19. difficult) [19] days end eventually. Tomorrow will be (20. bright) [20]!";

        function showTab(tabId) {
            document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tabId).classList.add('active');
        }

        window.onload = function() {
            let storyHtml = STORY_RAW;
            for(let i=0; i<20; i++) {
                storyHtml = storyHtml.replace(`[${i+1}]`, `<input type="text" id="ex3-in-${i}" class="w-28 text-center bg-transparent border-b-2 border-slate-300 font-bold text-indigo-600 mx-1" placeholder="?">`);
            }
            document.getElementById('story-container').innerHTML = storyHtml;

            const ctx = document.getElementById('pointsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Bài 1', 'Bài 2', 'Bài 3', 'Game'],
                    datasets: [{ label: 'Số câu đúng', data: [15, 8, 18, 25], backgroundColor: '#4f46e5', borderRadius: 10 }]
                },
                options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 30 } } }
            });
        };

        function checkEx3() {
            let score = 0;
            STORY_ANSWERS.forEach((ans, i) => {
                const inp = document.getElementById(`ex3-in-${i}`);
                if(inp.value.trim().toLowerCase() === ans.toLowerCase()) {
                    score++;
                    inp.className = "w-28 text-center bg-transparent correct mx-1";
                } else {
                    inp.className = "w-28 text-center bg-transparent incorrect mx-1";
                }
            });
            document.getElementById('stat-ex3').innerText = `${score}/20`;
            alert(`Kết quả Story: Cô đã hoàn thành ${score}/20 câu đúng!`);
        }
    </script>
</body>
</html>
